services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-kri_management}
      POSTGRES_USER: ${POSTGRES_USER:-kri_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-this-local-password}
    ports:
      - "5432:5432"
    volumes:
      - kri_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-kri_app} -d ${POSTGRES_DB:-kri_management}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./backend
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://kri_app:change-this-local-password@db:5432/kri_management}
      API_CORS_ORIGINS: ${API_CORS_ORIGINS:-http://localhost:3000}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  web:
    build: ./frontend
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  kri_postgres_data:
